apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
spec:
  # In-memory inventory belongs to a single process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: warehouse
  template: 
    metadata:
      labels:
        app: warehouse
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-konst
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: warehouse
                topologyKey: kubernetes.io/hostname
      containers:
        - name: warehouse
          image: konstantinsource/warehouse:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              hostPort: 81
              protocol: TCP
          env:
            - name: ENABLE_DEMO
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
spec:
  selector:
    app: warehouse
  ports:
    - port: 81
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
