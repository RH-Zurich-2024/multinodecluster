apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-service
  labels:
    app: transport-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transport-service
  template:
    metadata:
      labels:
        app: transport-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: transport-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: transport-service
          image: thenacken/transport-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SMELTING_URL
              value: "http://melting-service:80/smelt"
            - name: DB_HOST
              value: "postgres-cluster-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "app"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transport-service
  labels:
    app: transport-service
spec:
  type: ClusterIP
  selector:
    app: transport-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: transport
spec:
  type: NodePort
  selector:
    app: transport-service
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30020
      protocol: TCP