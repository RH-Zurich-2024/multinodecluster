apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: warehouse
  template:
    metadata:
      labels:
        app: warehouse
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-konst
      containers:
        - name: warehouse
          image: konstantinsource/warehouse:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: ENABLE_DEMO
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
spec:
  type: NodePort
  selector:
    app: warehouse
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
